# qBittorrent — download client (the BL-016 recut of the old in-guest-NFS CT 5007).
#
# community-scripts: ct/qbittorrent.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. Writes downloads under /data/torrents on the SAME
# shared export the *arr apps import from → hardlink + instant-move, and never an
# in-guest mount (the CT 5007 rootfs-fill race is designed out here).
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: qbittorrent
  stack: Media
  tags: [downloads]
  services:            # dashboard tile (superproject ADR-0012)
    - name: qBittorrent
      url: http://qbittorrent.homelab.chrison.internal:8090
      icon: qbittorrent
      description: Downloads
      widget: { type: qbittorrent, usernameFrom: QBIT_USER, passwordFrom: QBIT_PASSWORD, enableLeechProgress: true }

spec:
  app: qbittorrent
  ctid: 5104
  cores: 2
  memory: 2048           # MB — verification/hashing is the heaviest member
  disk: 8                # GB — app config only; downloads live on /data/torrents

  # DHCP reservation, because the WAN port-forward for the peer port (63429 → this CT,
  # superproject Infrastructure/unifi/network.yaml `qbittorrent-peers`) points at this address.
  # Unreserved, a lease change would silently send inbound peers to nothing, and the
  # private trackers would see us as unconnectable again (MAM did until 2026-10-07). Pangolin's
  # qBittorrent resource and Prowlarr's download client hard-code the same address.
  #
  # The local DNS record is explicit for the same reason as audiobookshelf's: the name is
  # otherwise served by UniFi's auto-registered DHCP hostname, which a retired CT with the same
  # hostname can win.
  network:
    reservation:
      fixedIp: 10.10.110.115
      localDnsRecord: qbittorrent.homelab.chrison.internal
      name: qbittorrent (CT 5104)

  # IPv6: the CT takes its global address by SLAAC under the ISP-delegated prefix, but with a
  # FIXED interface identifier `::6342:9` instead of the MAC-derived EUI-64 one. MyAnonamouse
  # flagged the EUI-64 address (…ff:fe…) as leaking the NIC MAC, and a fixed suffix also keeps
  # the address stable for the hand-made UniFi firewall policy `qbittorrent-peers-v6`
  # (External → Homelab, TCP+UDP 63429 to <prefix>::6342:9; network.yaml can't declare firewall
  # policies yet, UnifiSharp#20). Set by `ipv6-token.service` inside the CT
  # (`ip token set ::6342:9 dev eth0`, before networking), hand-made 2026-10-07 with no
  # converge provisioner. A rebuilt CT loses it: recreate the unit and the address returns to
  # EUI-64, which the firewall policy would no longer match. If the ISP prefix changes, update
  # the policy's destination address.

  # Categories tv-sonarr / radarr and save paths under /data/torrents are app-level
  # config applied at cutover (no converge provisioner) — see ./README.md.
  #
  # EXCLUDED FILE NAMES (app-level, set by hand 2026-10-08; no provisioner manages it): two
  # South Park "episodes" from Knaben, the public meta-search, turned out to contain .exe files.
  # Sonarr refused to import them, but the files still landed on disk. qBittorrent now never
  # downloads files matching *.exe *.scr *.bat *.cmd *.com *.pif *.lnk *.msi *.vbs *.vbe *.js *.jse
  # *.wsf *.hta *.ps1 *.jar *.apk *.dll (Options → Downloads → Excluded file names). Knaben stays
  # enabled on purpose: a junk public source is still useful for throwaway grabs and for what the
  # private trackers lack. Re-apply this after a rebuild: it lives in qBittorrent's own config only.
  #
  # ONE mount, deliberately. A second mp1 carried volume3's `data` at /mnt/data so the
  # torrents inherited from CT 5007 could resume by the ABSOLUTE save_path their fastresume
  # files recorded, with no data moved. That carry-over is finished (#347, the media-stack
  # cutover): every torrent was relocated onto volume4, and 0 of them still reference
  # /mnt/data. The mount had no readers left, so removing it means this CT can no longer be
  # affected by a volume3 outage. Retiring volume3 itself is separate (#199), and Plex keeps
  # its own volume3 mount (`data/media`, #329) — that one is untouched.
  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4
      source: data
      target: /data
      acl: true
      backup: false

    # SEED-ONLY TORRENTS, on the OTHER volume (#555). A torrent with no hardlink into
    # /data/media is seeding and nothing else, so it does not need to share a filesystem
    # with the library — moving it here takes its bytes off volume4 and its read load off
    # the spindles Plex uses.
    #
    # The move is qBittorrent's own: every torrent has auto_tmm and
    # category_changed_tmm_enabled is on, so setting a torrent's category to one whose save
    # path is under here makes qBittorrent relocate the files and keep seeding. No external
    # mover, no setLocation scripting.
    #
    # ⚠ This is a DIFFERENT filesystem from /data, so a hardlink cannot span the two. That
    # is fine for a torrent with no library link and destructive for one that has it: the
    # move would break the link, leaving Plex's copy and the torrent as two independent
    # files. Deciding what is safe to move is an inode test against the library, per
    # torrent — never st_nlink, and never per file.
    - type: nfs
      storage: ds1813-nfs-volume-3
      source: seedonly-torrents
      target: /seedonly-torrents
      acl: true
      backup: false

  # Guards BOTH exports now, not just volume4 — see the hookscript header.
  hookscript: local:snippets/ensure-data-mount.sh
