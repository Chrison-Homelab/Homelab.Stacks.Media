# Sonarr — TV series automation.
#
# community-scripts: ct/sonarr.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. Binds the shared /data export (TRaSH hardlinks).
# Validate against ../../Infrastructure/schema/shape.schema.json.


# ALLOWED HOSTS (app-level, set by hand 2026-10-09; no provisioner manages it): Sonarr only
# answers requests whose Host is one of: sonarr.arr.chrison.dev, sonarr.homelab.chrison.internal, 10.10.250.29, sonarr
# (plus localhost/127.0.0.1/::1 and its own machine name, which are always allowed). Anything else gets
# 400 Bad Request: that's protection against DNS rebinding, and it cleared the "Allowed Hosts is not configured"
# health warning. ⚠ A NEW way of reaching this app (a renamed host, a new IP, another proxy name) must be added under
# Settings → General → Allowed Hosts, or that client starts failing with 400. Re-apply after a rebuild.
apiVersion: homelab/v1
kind: LXC

metadata:
  name: sonarr
  stack: Media
  tags: [tv]
  services:            # dashboard tile (superproject ADR-0012)
    - name: Sonarr
      url: http://sonarr.homelab.chrison.internal:8989
      icon: sonarr
      description: TV
      widget: { type: sonarr, keyFrom: SONARR_API_KEY, enableQueue: true }

spec:
  app: sonarr
  ctid: 5101
  cores: 2
  memory: 1024           # MB
  disk: 8                # GB — app DB only; media lives on /data
  dependsOn: [prowlarr, qbittorrent]   # indexers + download client first

  # Shared media library + downloads on volume4, host-level + gated (BL-016).
  # Path-bind of the ONE shared export at /data so torrents/ and media/ are on the
  # same filesystem → instant hardlink-moves. Identical mount in every *arr CT.
  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4   # references the storage → ordered on activation
      source: data                   # subpath under /mnt/pve/ds1813-nfs-volume-4 (path-bind)
      target: /data
      acl: true                      # honor the export's setgid + default group ACLs
      backup: false                  # data lives on the NAS; keep out of vzdump
  hookscript: local:snippets/ensure-data-mount.sh   # pre-start guard: NAS mounted or refuse to start
