# audiobookshelf — audiobook + podcast server with native iOS/Android apps. Net-new.
#
# community-scripts: ct/audiobookshelf.sh (stable). Self-contained — SQLite (no external
# DB), FFmpeg for media probing; serves on port 13378. Libraries are added via the web UI
# (pointing at mounted paths) → no converge provisioner.
#
# Library on NFS: bind ONLY the volume4 `audiobooks` and `ebooks` subpaths (never the whole
# /data export) — this CT is PUBLICLY exposed, so its view of the NAS stays limited to the
# two trees it serves. Same pre-start guard as the *arr.
#
# EBOOKS (Homelab#356 follow-up): the retired CT 5014 carried TWO libraries — 124 audiobooks
# and 822 ebooks — and only the audiobook half was rebuilt. The ebooks moved from volume3 to
# volume4 `ebooks` and are bound here so this CT can serve both, which is what finally lets
# CT 5014 be destroyed under #199. Nothing else consumes them: shelfmark (CT 5111) is a
# search/request hub whose /books is an ingest dir, not a library.
#
# EXPOSURE — PUBLIC, DIRECT (no CF Access OTP): audiobookshelf has native mobile apps that
# can't satisfy One-Time PIN, and it carries its own account auth. So its tunnel ingress is
# flagged `public: true` in cloudflared.lxc.yaml — DNS + routing, but NOT behind the Access
# gate (unlike the *arr admin UIs). See task #14 (exposure-surface review).
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: audiobookshelf
  stack: Media
  tags: [audiobooks, podcasts]
  services:            # dashboard tile (superproject ADR-0012). Matches audiobookshelf.arr (Pangolin) and the audiobookshelf.* tunnel hosts by name.
    - name: Audiobookshelf
      url: http://audiobookshelf.homelab.chrison.internal:13378
      icon: audiobookshelf
      description: Audiobooks and podcasts — own accounts, native apps
      widget: { type: audiobookshelf, keyFrom: ABS_API_KEY }

spec:
  app: audiobookshelf
  ctid: 5112
  cores: 2
  memory: 2048           # MB — Node app + FFmpeg transcode/probe
  disk: 8                # GB — app + SQLite + metadata/cache; audiobooks live on /audiobooks (NFS)

  # DHCP reservation (#416). The Media tunnel pins this address as the origin for
  # audiobookshelf.chrison.dev, which is `public: true` — the native mobile apps hold it
  # directly and can't be sent through an SSO gate, so a moved lease breaks them silently.
  # Only the reservation is set here — bridge/vlan/ipv4 still come from the stack.
  network:
    reservation:
      fixedIp: 10.10.182.200
      # Explicit local DNS record so audiobookshelf.homelab.chrison.internal resolves to THIS
      # CT. Without it the name is served by UniFi's auto-registered DHCP hostname, which the
      # destroyed CT 5014 (same hostname 'audiobookshelf') still won at a dead address until
      # this was declared — fallout of retiring the 50xx fleet (Homelab#199).
      localDnsRecord: audiobookshelf.homelab.chrison.internal
      name: audiobookshelf (CT 5112)

  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4
      source: audiobooks                 # volume4 subpath only (public CT → minimal NAS view)
      target: /audiobooks
      acl: true
      backup: false

    - type: nfs
      storage: ds1813-nfs-volume-4
      source: ebooks                     # volume4 subpath only (public CT → minimal NAS view)
      target: /ebooks
      acl: true
      backup: false
  hookscript: local:snippets/ensure-data-mount.sh   # pre-start guard: volume4 mounted or refuse to start
