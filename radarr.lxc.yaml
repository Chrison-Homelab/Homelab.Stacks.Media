# Radarr — movie automation.
#
# community-scripts: ct/radarr.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. Binds the shared /data export (TRaSH hardlinks).
# Validate against ../../Infrastructure/schema/shape.schema.json.


# ALLOWED HOSTS (app-level, set by hand 2026-10-09; no provisioner manages it): Radarr only
# answers requests whose Host is one of: radarr.arr.chrison.dev, radarr.homelab.chrison.internal, 10.10.48.217, radarr
# (plus localhost/127.0.0.1/::1 and its own machine name, which are always allowed). Anything else gets
# 400 Bad Request: that's protection against DNS rebinding, and it cleared the "Allowed Hosts is not configured"
# health warning. ⚠ A NEW way of reaching this app (a renamed host, a new IP, another proxy name) must be added under
# Settings → General → Allowed Hosts, or that client starts failing with 400. Re-apply after a rebuild.
apiVersion: homelab/v1
kind: LXC

metadata:
  name: radarr
  stack: Media
  tags: [movies]
  services:            # dashboard tile (superproject ADR-0012)
    - name: Radarr
      url: http://radarr.homelab.chrison.internal:7878
      icon: radarr
      description: Movies
      widget: { type: radarr, keyFrom: RADARR_API_KEY, enableQueue: true }

spec:
  app: radarr
  ctid: 5102
  cores: 2
  memory: 1024           # MB
  disk: 8                # GB — app DB only; media lives on /data
  dependsOn: [prowlarr, qbittorrent]

  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4
      source: data
      target: /data
      acl: true
      backup: false
  hookscript: local:snippets/ensure-data-mount.sh
