      # Not decodable by the Apple TV — Plex must transcode. Scored 0, NOT negative: with
      # minFormatScore 0 a negative score is a hard reject, and some titles ship only like
      # this. Zero means "taken when it is the only option, never preferred over DD+".
      - trash_ids:
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
