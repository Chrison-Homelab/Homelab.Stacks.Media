# Recyclarr — CUSTOM FORMATS ONLY. Deliberately no `quality_profiles:` block.
#
# Why: a TRaSH quality-profile template turns on upgrades and rewrites the cutoff. Across
# a 453-file library with live hit-and-run obligations that would mean mass re-downloading,
# so profile STRUCTURE stays hand-managed and recyclarr only maintains custom formats and
# their scores. See Homelab#556.
#
# Consequence worth stating: TRaSH publishes its scores INSIDE its profile templates, so
# excluding profiles means the scores below are OURS, not the guide's. They are chosen to
# reject junk and to prefer repacks, and nothing else.
#
# Two guide formats are deliberately NOT synced:
#   - `9b27ab6498ec0f31a3353992e19434ca` DV (w/o HDR fallback) — we already have a
#     hand-built equivalent (Sonarr CF id 1) verified against the live library. Syncing
#     the guide's version too would penalise the same release twice.
#   - `Scene` and `BW` / `Black and White Editions` — too blunt. Scene is the only option
#     on some trackers, and a black-and-white film is not a defect.

sonarr:
  sonarr:
    base_url: http://10.10.250.29:8989
    api_key: !env_var SONARR_API_KEY

    custom_formats:
      # Junk — reject outright. Every profile carries minFormatScore -2000, so -10000 blocks.
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - 6f808933a71bd9666531610cb8c059cc # BR-DISK (BTN)
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        assign_scores_to:
          - { name: Any, score: -10000 }
          - { name: SD, score: -10000 }
          - { name: HD-720p, score: -10000 }
          - { name: HD-1080p, score: -10000 }
          - { name: Ultra-HD, score: -10000 }
          - { name: HD - 720p/1080p, score: -10000 }
          - { name: Any (with upgrades), score: -10000 }

      # Prefer a fixed release over the original. Harmless where upgrades are off.
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
        assign_scores_to:
          - { name: Any, score: 5 }
          - { name: SD, score: 5 }
          - { name: HD-720p, score: 5 }
          - { name: HD-1080p, score: 5 }
          - { name: Ultra-HD, score: 5 }
          - { name: HD - 720p/1080p, score: 5 }
          - { name: Any (with upgrades), score: 5 }

